<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #1C2B2D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #1C2B2D;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      color: #1C2B2D;
      outline: none;
      margin-bottom: 16px;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #1A6B7C; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #1C2B2D;
      color: #F4A825;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1A6B7C; }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🍹 Beach Bar</div>
  <div class="sub">Admin Dashboard</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" placeholder="admin" autocomplete="username" required />
    <label>Password</label>
    <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
    <button type="submit" class="btn">Sign in →</button>
  </form>
</div>
</body>
</html>
