<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      min-height: 100vh;
      padding: 16px;
    }

    .header {
      background: #f59e0b;
      color: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 { font-size: 24px; font-weight: 700; }
    .header p  { font-size: 14px; opacity: 0.85; margin-top: 4px; }

    .state-box {
      background: #fff;
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .state-box .icon { font-size: 48px; margin-bottom: 12px; }
    .state-box h2    { font-size: 18px; font-weight: 700; color: #dc2626; }
    .state-box p     { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.5; }

    .table-badge {
      background: #fff;
      border: 2px solid #f59e0b;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .table-badge .icon { font-size: 32px; }
    .table-badge h2   { font-size: 20px; font-weight: 700; color: #1a1a1a; }
    .table-badge p    { font-size: 13px; color: #888; }

    .session-info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #166534;
      margin-bottom: 20px;
      font-family: monospace;
    }

    .placeholder {
      background: #fff;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .placeholder .icon { font-size: 48px; margin-bottom: 12px; }
    .placeholder h3 { font-size: 16px; font-weight: 600; color: #444; margin-bottom: 8px; }
    .placeholder p  { font-size: 13px; color: #888; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🍹 Beach Bar</h1>
    <p>Tap to order from your table</p>
  </div>

  {% if error %}
    <!-- Error — validation failed in Python -->
    <div class="state-box">
      <div class="icon">❌</div>
      <h2>{{ error_title }}</h2>
      <p>{{ error }}</p>
    </div>

  {% else %}
    <!-- Success — session validated and consumed in Python -->
    <div class="table-badge">
      <div class="icon">🏖️</div>
      <div>
        <h2>{{ table_id }}</h2>
        <p>Session verified ✓</p>
      </div>
    </div>

    <div class="session-info">
      Session: {{ session_id }}
    </div>

    <!-- YOUR ORDER UI GOES HERE -->
    <div class="placeholder">
      <div class="icon">🍔</div>
      <h3>Menu coming soon</h3>
      <p>
        Session is valid and table is identified.<br>
        Replace this section with your order UI.
      </p>
    </div>

  {% endif %}

</body>
</html>
